<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Degradê de fundo do escudo vermelho do CBMPA -->
    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="60%" stop-color="#B91C1C"/>
      <stop offset="100%" stop-color="#7F1D1D"/>
    </linearGradient>

    <!-- Degradê dourado para bordas e machados -->
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="45%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>

    <!-- Degradê da chama de incêndio -->
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#EA580C"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FEF08A"/>
    </linearGradient>

    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Escudo Principal -->
  <path d="M32 3 L57 11 C57 37 45.5 53 32 61 C18.5 53 7 37 7 11 Z" 
        fill="url(#shieldBg)" 
        stroke="url(#goldBorder)" 
        stroke-width="3" 
        stroke-linejoin="round"
        filter="url(#shadow)"/>

  <!-- Filete Dourado Interno -->
  <path d="M32 7.5 L52.5 14 C52.5 35 42.5 48.5 32 55.5 C21.5 48.5 11.5 35 11.5 14 Z" 
        fill="none" 
        stroke="#FEF08A" 
        stroke-width="1.2" 
        stroke-opacity="0.45" 
        stroke-linejoin="round"/>

  <!-- Machados Cruzados de Bombeiro (Símbolo de Salvamento e Combate) -->
  <g stroke="url(#goldBorder)" stroke-width="2.5" stroke-linecap="round" opacity="0.95">
    <line x1="18" y1="46" x2="46" y2="18" />
    <line x1="46" y1="46" x2="18" y2="18" />
    <!-- Lâminas dos machados -->
    <path d="M43 14 C46 13 49 15 50 18 C47 20 44 19 42 17 Z" fill="url(#goldBorder)" stroke="none"/>
    <path d="M21 14 C18 13 15 15 14 18 C17 20 20 19 22 17 Z" fill="url(#goldBorder)" stroke="none"/>
  </g>

  <!-- Chama Central Heroica -->
  <!-- Chama Externa -->
  <path d="M32 19 C32 19 22.5 30 22.5 38.5 C22.5 44.5 26.5 48.5 32 48.5 C37.5 48.5 41.5 44.5 41.5 38.5 C41.5 30 32 19 32 19 Z" 
        fill="url(#flameGrad)" 
        filter="url(#shadow)"/>

  <!-- Núcleo Branco/Brilhante da Chama -->
  <path d="M32 28 C32 28 26.5 34.5 26.5 39.5 C26.5 43 28.8 45.5 32 45.5 C35.2 45.5 37.5 43 37.5 39.5 C37.5 34.5 32 28 32 28 Z" 
        fill="#FFFFFF" 
        opacity="0.9"/>

  <!-- Estrela Solitária do Pará (Topo do Escudo) -->
  <polygon points="32,7.5 33.5,11.5 37.5,11.8 34.5,14.5 35.3,18.5 32,16.3 28.7,18.5 29.5,14.5 26.5,11.8 30.5,11.5" 
           fill="url(#goldBorder)"/>
</svg>
